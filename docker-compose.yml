version: "3.9"

services:
  # PostgreSQL with Apache AGE extension
  postgres:
    image: apache/age:v1.5.0-pg16
    container_name: zaprica-postgres
    environment:
      POSTGRES_USER: zaprica
      POSTGRES_PASSWORD: zaprica_dev_password
      POSTGRES_DB: zaprica
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaprica"]
      interval: 5s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible evidence storage)
  minio:
    image: minio/minio:latest
    container_name: zaprica-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zaprica_minio
      MINIO_ROOT_PASSWORD: zaprica_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis (for caching, rate limiting, pub/sub)
  redis:
    image: redis:7-alpine
    container_name: zaprica-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zaprica-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://zaprica:zaprica_dev_password@postgres:5432/zaprica
      - DATABASE_URL_SYNC=postgresql://zaprica:zaprica_dev_password@postgres:5432/zaprica
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=zaprica_minio
      - MINIO_SECRET_KEY=zaprica_minio_secret
      - MINIO_BUCKET=zaprica-evidence
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRY_MINUTES=60
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  minio_data:
